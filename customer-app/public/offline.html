<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueueFree — Offline</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0D7377; color: white;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; text-align: center; padding: 2rem; }
    h1 { font-size: 3rem; font-weight: 900; margin: 0; }
    p { font-size: 1.25rem; opacity: 0.8; margin-top: 1rem; }
    button { margin-top: 2rem; padding: 1rem 2.5rem; border-radius: 1rem; border: none;
             background: white; color: #0D7377; font-size: 1.125rem; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div style="font-size:5rem">📵</div>
  <h1>No Connection</h1>
  <p>The kiosk is offline. Please check the network connection and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
